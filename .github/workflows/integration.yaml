name: Integration
on:
  push:
    branches:
      - "**"
jobs:
  integrate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11.0, 3.12.0, 3.13.0, 3.14.0]
    container:
      image: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          python -m venv ~/.venv
          . ~/.venv/bin/activate
          . scripts/integrate.sh
